<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, follow">
    <title>Redirecting... | Linpane Legal Services</title>
</head>
<body>
<script>
    (function () {
        var p = location.pathname.replace(/\/contact\.html$/i, '').replace(/\/+$/, '');
        window.location.replace(p + '/contact');
    })();
</script>
    <p><a href='#' id='fallback'>Taking you to /contact - click if not redirected</a></p>
    <script>document.getElementById('fallback').addEventListener('click', function (e) { e.preventDefault(); var p = location.pathname.replace(/\/contact\.html$/i, '').replace(/\/+$/, ''); window.location.href = p + '/contact'; });</script>
</body>
</html>
