        function siteBase() { try { return window.SITE_BASE || ''; } catch(e) { return ''; } }
        var seconds = 10;

            seconds--;
            if (span) span.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = siteBase() + '/';
            }
        }, 1000);
    </script>
